server {
    listen 80;
    server_name mynextpr.com www.mynextpr.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mynextpr.com www.mynextpr.com;
    ssl_certificate /etc/letsencrypt/live/mynextpr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mynextpr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # sandbox: plain static root not used (stdlib server renders pages);
    # proxy everything to the cloud-sandbox backend
    location / {
        proxy_pass http://localhost:8139;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10M;
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
    }

    # cache the heavy static bytes at the edge
    location ~* \.(glb|mp4|jpg|png|js)$ {
        proxy_pass http://localhost:8139;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
