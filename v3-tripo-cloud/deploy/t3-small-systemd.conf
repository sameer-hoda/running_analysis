[Unit]
Description=RunForm tripo-cloud sandbox (t3.small)
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User=ec2-user
WorkingDirectory=/home/ec2-user/v3-tripo-cloud
Environment=RUNFORM_ROOT=/home/ec2-user/v3-tripo-cloud
ExecStart=/home/ec2-user/v3-tripo-cloud/venv/bin/python site/server.py 8139
Restart=always
RestartSec=5
# t3.small guardrails: keep RSS small (no torch here), restart on leak
MemoryMax=1500M

[Install]
WantedBy=multi-user.target
