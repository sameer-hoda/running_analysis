<html lang="en">
<head>

<style>
  :root{
    --lime:#c8f04a; --bg:#0a0c11; --bg2:#0e1219; --panel:#12161d; --panel2:#171d26; --ink:#f4f7f2; --dim:#8b938a; --faint:#5b635c;
    --optimal:#38d17d; --fair:#e6a63a; --critical:#ee5a44; --insuf:#8e9bb0;
    --line:#1c232d; --line2:#2a3441; --radius:20px; --radius-sm:13px; --tap:44px;
    --shadow:0 24px 60px -20px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  html{background:radial-gradient(120% 80% at 70% -10%,#141b26 0%,transparent 55%),radial-gradient(90% 60% at 0% 100%,#10161f 0%,transparent 50%),var(--bg)}
  #dots-bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
  body{font-family:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:transparent;
    color:var(--ink);margin:0;min-height:100vh;-webkit-font-smoothing:antialiased}
  a{color:var(--lime);text-decoration:none}
  button{font-family:inherit}

  .top{display:flex;align-items:center;gap:14px;padding:16px 26px;position:sticky;top:0;z-index:20;
    background:linear-gradient(rgba(10,12,17,.9),rgba(10,12,17,.55));backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.04)}
  .top .back{font-size:13px;color:var(--dim);transition:color .2s}
  .top .back:hover{color:var(--ink)}
  .top .brand{font-weight:700;letter-spacing:.26em;text-transform:uppercase;font-size:11px;color:var(--lime);opacity:.9}
  .top .top-actions{margin-left:auto;display:flex;gap:8px}
  .ibtn{background:rgba(255,255,255,.03);color:var(--ink);border:1px solid var(--line2);border-radius:11px;padding:8px 15px;font-size:13px;cursor:pointer;min-height:var(--tap);transition:.2s}
  .ibtn:hover{border-color:var(--lime);color:var(--lime);background:rgba(200,240,74,.06)}

  #main{display:flex;gap:22px;align-items:flex-start;padding:22px 26px 130px;max-width:1480px;margin:0 auto}
  #stage-col{flex:1.8;min-width:0}
  #viewport{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,.05);box-shadow:var(--shadow);
    background:radial-gradient(90% 70% at 50% 8%,#18202b 0%,#0c1016 62%,#090b0f 100%)}
  #viewport:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:radial-gradient(110% 80% at 50% 30%,transparent 55%,rgba(0,0,0,.55) 100%)}
  #stage{width:100%;height:68vh;min-height:420px;display:block;touch-action:none;cursor:grab}
  #stage:active{cursor:grabbing}
  #fallback{width:100%;height:68vh;min-height:420px;display:none;background:#0c1016}
  .vp-top{position:absolute;top:16px;left:18px;right:18px;display:flex;align-items:center;gap:10px;pointer-events:none;z-index:4}
  .vp-title{font-size:11.5px;letter-spacing:.02em;color:var(--dim);background:rgba(9,12,17,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.06);border-radius:999px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}

  #loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;z-index:3;transition:opacity .6s}
  .spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.1);border-top-color:var(--lime);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loading p{font-size:12.5px;color:var(--dim);letter-spacing:.04em;margin:0}

  /* guided walkthrough */
  #tourCtl{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .3s}
  #tourPlay{display:inline-flex;align-items:center;gap:11px;background:linear-gradient(135deg,#dcff72,#a9e33c);color:#0e1206;font-weight:800;font-size:15px;letter-spacing:.01em;border:0;border-radius:999px;padding:15px 27px;cursor:pointer;min-height:54px;white-space:nowrap;animation:tourPulse 2.8s ease-in-out infinite;transition:transform .18s}
  #tourPlay:hover{transform:translateY(-2px) scale(1.03)}
  #tourPlay svg{width:13px;height:14px;fill:currentColor}
  @keyframes tourPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(200,240,74,.45),0 16px 40px -12px rgba(200,240,74,.6)}
    50%{box-shadow:0 0 0 14px rgba(200,240,74,0),0 20px 50px -12px rgba(200,240,74,.85)}
  }
  #tourHud{display:none;align-items:center;gap:10px;background:rgba(11,14,19,.84);backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 12px;box-shadow:0 20px 50px -18px rgba(0,0,0,.9)}
  #tourHud.on{display:flex}
  #tourHud button{background:transparent;border:0;color:var(--ink);cursor:pointer;width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:15px;transition:.18s}
  #tourHud button:hover{background:rgba(255,255,255,.08);color:var(--lime)}
  #tourHud button svg{width:17px;height:17px;display:block}
  #tourHud .tstep{font-size:12.5px;color:var(--dim);min-width:96px;text-align:center}
  #tourHud .tstep b{color:var(--ink);font-weight:700}
  #tourDots{display:flex;gap:5px;padding:0 2px}
  #tourDots i{width:6px;height:6px;border-radius:50%;background:#39414c;transition:.25s;cursor:pointer}
  #tourDots i.on{background:var(--lime);transform:scale(1.4)}
  #tourDots i.done{background:#5f6a5b}
  #tourHud .tsep{width:1px;height:22px;background:rgba(255,255,255,.1)}
  #tourHud .ctag{font-size:10.5px;color:var(--faint);letter-spacing:.04em;padding:0 4px;white-space:nowrap}
  #tourHud .volval{font-size:10.5px;color:var(--dim);min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
  @media (max-width:600px){
    #tourHud{flex-wrap:wrap;justify-content:center;border-radius:22px;width:94vw;max-width:94vw;row-gap:4px}
    #tourHud .ctag,#tourHud .tsep{display:none}
    #tourHud .tstep{min-width:auto;font-size:11.5px}
  }

  /* hover callout */
  #tip{position:absolute;z-index:6;pointer-events:none;display:flex;align-items:center;gap:8px;
    background:rgba(12,15,20,.82);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.1);
    border-radius:999px;padding:6px 13px 6px 9px;opacity:0;transform:translate(-50%,-50%) scale(.94);transition:opacity .16s,transform .16s;white-space:nowrap;box-shadow:0 12px 30px -10px rgba(0,0,0,.8)}
  #tip.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #tip .td{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px 1px currentColor}
  #tip b{font-size:13px;font-weight:800}
  @media (max-height:500px){
    #tourPlay{min-height:44px;padding:10px 20px;font-size:13px}
  }

  .toolbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:16px}
  .tgroup{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .tlbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-right:2px}
  .tbtn{background:rgba(255,255,255,.03);color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:12.5px;cursor:pointer;min-width:44px;min-height:var(--tap);transition:.18s}
  .tbtn:hover{color:var(--ink);border-color:var(--line2);background:rgba(255,255,255,.05)}
  .tbtn[aria-pressed="true"],.tbtn.active{border-color:rgba(200,240,74,.5);color:var(--lime);background:rgba(200,240,74,.07)}
  .legend{display:flex;gap:18px;font-size:12px;color:var(--dim);margin-top:14px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px 1px currentColor;transition:transform .3s}
  .legend.hi span{color:var(--ink)}
  .legend.hi i{transform:scale(1.35)}

  #report{flex:.62;min-width:286px;max-width:348px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 40%),var(--panel);
    border:1px solid rgba(255,255,255,.05);border-radius:var(--radius);padding:18px;position:sticky;top:82px;box-shadow:var(--shadow)}
  .scoreblock{display:flex;align-items:center;gap:14px}
  .ring{position:relative;width:94px;height:94px;flex:none}
  .ring svg{width:94px;height:94px}
  .ring-track{fill:none;stroke:#1a212b;stroke-width:8}
  .ring-arc{fill:none;stroke:var(--lime);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.16,.84,.24,1),stroke .6s}
  .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-num b{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .ring-num small{font-size:8.5px;color:var(--faint);letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
  .scorecopy{min-width:0}
  #scoreLbl{font-size:15px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
  #summary{font-size:12px;color:var(--dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  .scale{display:flex;gap:3px;margin:15px 0 3px}
  .seg{flex:1;text-align:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding-top:8px;border-top:3px solid var(--line);opacity:.5;transition:.4s}
  .seg.optimal.on,.seg.fair.on,.seg.critical.on{border-color:var(--lime);color:var(--ink);opacity:1}

  .stats{display:flex;gap:6px;margin:12px 0 3px;flex-wrap:wrap}
  .stat{font-size:10.5px;font-weight:600;border-radius:999px;padding:4px 10px;border:1px solid var(--line2);color:var(--dim)}
  .stat b{color:var(--ink)}

  .zonelist{margin-top:10px;display:flex;flex-direction:column;gap:2px}
  .zrow{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;padding:9px 10px;cursor:pointer;color:var(--ink);min-height:var(--tap);transition:background .18s,border-color .18s,transform .18s;overflow:hidden}
  .zrow:hover{background:var(--panel2);border-color:var(--line)}
  .zrow:active{transform:scale(.99)}
  .zrow.sel{background:var(--panel2);border-color:var(--line2)}
  .zbar{position:absolute;left:0;bottom:0;height:2px;border-radius:2px;opacity:.5;transition:width .8s cubic-bezier(.16,.84,.24,1),opacity .2s}
  .zrow.sel .zbar,.zrow:hover .zbar{opacity:.95}
  .zdot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 9px 1px currentColor}
  .zt{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zs{font-size:13px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
  .zrow .zc{color:#3d453f;font-size:15px;line-height:1;transition:.2s}
  .zrow:hover .zc{color:var(--lime);transform:translateX(2px)}
  .zrow.need .zt{color:var(--dim);font-weight:500}
  .meta{font-size:11px;color:var(--faint);margin-top:14px;line-height:1.6}
  #status{color:var(--lime);margin-top:10px}

  /* inline detail view (takes over the scorecard, never covers the model) */
  #detailView{padding-top:2px;animation:cin .35s both}
  .dback{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.03);border:1px solid var(--line2);color:var(--dim);border-radius:10px;padding:7px 13px;font-size:12px;cursor:pointer;min-height:38px;margin-bottom:12px;transition:.18s}
  .dback:hover{color:var(--lime);border-color:var(--lime)}
  .dback span{font-size:16px;line-height:1}
  #detailView .sh-title{font-size:18px}
  .sh-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .sh-title{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .sh-pill{font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 12px;letter-spacing:.02em}
  .sh-tldr{font-size:15px;margin:14px 0 2px;line-height:1.5;letter-spacing:-.01em}
  .sh-obs{font-size:13px;color:var(--dim);margin:7px 0;line-height:1.6}
  .sh-cues{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:9px}
  .sh-cues li{display:flex;gap:12px;font-size:13.5px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;line-height:1.45;animation:cin .4s both}
  @keyframes cin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sh-cues li b{color:var(--lime);flex:none;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding-top:3px;width:40px}
  details.evi{margin-top:16px;font-size:12.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:14px}
  details.evi summary{cursor:pointer;color:var(--ink);font-size:12.5px;list-style:none}
  details.evi summary::-webkit-details-marker{display:none}
  details.evi summary:before{content:"＋ ";color:var(--lime)}
  details.evi[open] summary:before{content:"− "}
  details.evi p{margin:9px 0 0;line-height:1.65}
  .retake{font-size:12.5px;color:var(--lime);margin:14px 0 0;background:rgba(200,240,74,.07);border:1px solid rgba(200,240,74,.22);border-radius:12px;padding:12px 14px;line-height:1.5}
  .sh-fig{width:100%;border-radius:14px;background:linear-gradient(180deg,#171d26,#11151c);border:1px solid var(--line);margin:16px 0 0;overflow:hidden}
  .sh-fig svg{display:block;width:100%;height:auto}
  .sh-sect{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:18px 0 7px}
  .sh-ideal{font-size:13.5px;color:var(--ink);line-height:1.55;margin:0}
  .sh-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.sh-cols{grid-template-columns:1fr}}
  .sh-box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .sh-box h5{margin:0 0 7px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .sh-box ul{margin:0;padding-left:15px;font-size:12.5px;color:var(--dim);line-height:1.6}
  .sh-test{font-size:12.5px;color:var(--dim);line-height:1.6;margin:0}
  .sh-test b{color:var(--ink)}
  @media (min-width:780px){
    #detailView .sh-cols{grid-template-columns:1fr 1fr}
  }

  /* showcase mode: model only, no chrome, no captions (for the hero video) */
  body.showcase .top .top-actions,body.showcase .toolbar,body.showcase .legend,body.showcase #report,
  body.showcase #tourHud,body.showcase #tourCtl,body.showcase .vp-top{display:none!important}
  body.showcase #main{padding:0;max-width:none;display:block}
  body.showcase #viewport{border-radius:0;height:100vh;min-height:100vh;border:0}
  body.showcase #stage,body.showcase #fallback{height:100vh;min-height:520px}
  body.showcase .top{display:none!important}
  :focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:9px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:1000px){
    #main{flex-direction:column;padding:12px 12px 96px;gap:14px}
    #stage-col{width:100%}
    #viewport{border-radius:16px}
    #stage,#fallback{height:min(58vh,560px);min-height:360px}
    #report{position:static;max-width:none;width:100%;padding:16px}
    .scoreblock{gap:12px}
    .ring{width:82px;height:82px}.ring svg{width:82px;height:82px}.ring-num b{font-size:28px}
    .toolbar{gap:8px}.legend{gap:12px;font-size:11.5px}
  }
  @media (max-width:600px){ #tourPlay{padding:13px 22px;font-size:14px;gap:9px} }
  @media (max-width:400px){ #stage,#fallback{height:min(54vh,480px)} }
  /* short landscape screens: keep the whole viewport + tour tray inside the fold */
  @media (max-height:500px){ #stage,#fallback{height:74vh;min-height:260px} }
  @media print{.top,.toolbar,.legend,#status,#resume{display:none}body{background:#fff;color:#000}}
</style>
<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>

<body>
<canvas id="dots-bg"></canvas>
<header class="top">
  <a class="back" href="/">← RunForm</a>
  <div class="brand">Studio</div>
  <div class="top-actions">
    <button id="shareBtn" class="ibtn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><path d="M12 16V3"/><path d="M8 7l4-4 4 4"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>Share</button>
  </div>
</header>

<div id="main">
  <section id="stage-col">
    <div id="viewport">
      <canvas id="stage"></canvas>
      <canvas id="fallback"></canvas>
      <div class="vp-top">
        <span class="vp-title" id="camMeta">—</span>
      </div>
      <div id="tip"><span class="td"></span><b></b></div>
      <div id="tourCtl" style="display:none">
        <button id="tourPlay" type="button"><svg viewBox="0 0 12 14" aria-hidden="true"><path d="M1 1.5v11l10-5.5z"/></svg><span>Play walkthrough</span></button>
        <div id="tourHud">
          <button id="tourPrev" type="button" aria-label="Previous">‹</button>
          <div id="tourDots"></div>
          <button id="tourNext" type="button" aria-label="Next">›</button>
          <div class="tsep"></div>
          <div class="tstep" id="tourStep">—</div>
          <span class="ctag" id="coachTag">Coach: …</span>
          <button id="volDown" type="button" aria-label="Volume down" title="Volume down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/></svg></button>
          <span class="volval" id="volVal">80</span>
          <button id="volUp" type="button" aria-label="Volume up" title="Volume up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6.5a8.5 8.5 0 0 1 0 11"/></svg></button>
          <button id="tourStop" type="button" aria-label="End walkthrough">✕</button>
        </div>
      </div>
      <div id="loading"><div class="spin"></div><p>Building your runner…</p></div>
    </div>
    <div class="toolbar" role="toolbar" aria-label="Camera view">
      <div class="tgroup" role="radiogroup" aria-label="Camera view">
        <span class="tlbl">View</span>
        <button class="tbtn active" data-view="hero" aria-pressed="true">¾</button>
        <button class="tbtn" data-view="front" aria-pressed="false">Front</button>
        <button class="tbtn" data-view="side" aria-pressed="false">Side</button>
        <button class="tbtn" data-view="back" aria-pressed="false">Back</button>
        <button class="tbtn" data-view="top" aria-pressed="false">Top</button>
      </div>
    </div>
    <div class="legend">
      <span><i style="background:#eef2ea"></i>scored zone</span>
      <span><i style="background:transparent;border:1px dashed #9aa7ba;box-shadow:none"></i>needs another view</span>
    </div>
  </section>

  <aside id="report">
    <div id="scorecardView">
      <div class="scoreblock">
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle class="ring-arc" id="ringArc" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"></circle>
          </svg>
          <div class="ring-num"><b id="score">–</b><small>score</small></div>
        </div>
        <div class="scorecopy">
          <div id="scoreLbl">—</div>
          <div id="summary">—</div>
        </div>
      </div>
      <div class="scale" id="scale">
        <span class="seg optimal" data-band="optimal">Optimal</span>
        <span class="seg fair" data-band="fair">Fair</span>
        <span class="seg critical" data-band="critical">Critical</span>
      </div>

/* ---------- Karaoke captions (word-highlighted, synced to the voice) ---------- */
var CAP=(function(){
  var el=null, words=[], weights=[], total=1, active=-1, raf=0;
  function node(){ if(!el) el=document.getElementById("cap"); return el; }
  function start(text){
    var e=node(); if(!e) return;
    words=String(text||"").split(/\s+/).filter(Boolean);
    weights=words.map(function(w){ return Math.max(1,w.replace(/[^\w']/g,"").length)+(/[,.;:!?—]$/.test(w)?2:0); });
    total=weights.reduce(function(a,b){return a+b;},0)||1;
    e.innerHTML="";
    words.forEach(function(w){ var s=document.createElement("span"); s.textContent=w; e.appendChild(s); });
    active=-1; e.classList.add("on");
  }
  function at(ratio){
    var e=node(); if(!e||!words.length) return;
    ratio=Math.max(0,Math.min(1,ratio));
    var target=ratio*total, acc=0, idx=words.length-1;
    for(var i=0;i<weights.length;i++){ acc+=weights[i]; if(target<=acc){ idx=i; break; } }
    if(idx===active) return; active=idx;
    var ch=e.children;
    for(var j=0;j<ch.length;j++){
      ch[j].classList.toggle("hot", j<=idx);
      ch[j].classList.toggle("hide", j<idx-7 || j>idx+4); // rolling window: last few words
    }
  }
  function fromAudio(a, estMs){
    var est=(estMs||8000)/1000;
    (function frame(){
      if(!a || a.paused || a.ended) return;
      var dur=(isFinite(a.duration)&&a.duration>0)?a.duration:est;
      at((a.currentTime||0)/dur);
      raf=requestAnimationFrame(frame);
    })();
  }
  function timed(text, durMs){
    start(text);
    var t0=performance.now();
    return new Promise(function(res){
      (function frame(){
        var k=Math.min(1,(performance.now()-t0)/Math.max(1,durMs));
        at(k); if(k<1) raf=requestAnimationFrame(frame); else res();
      })();
    });
  }
  function stop(){ var e=node(); if(e) e.classList.remove("on"); if(raf){ cancelAnimationFrame(raf); raf=0; } }
  return { start:start, at:at, fromAudio:fromAudio, timed:timed, stop:stop };
})();

    var w=fb.clientWidth||fb.parentElement.clientWidth||600, h=Math.round(window.innerHeight*0.6)||440;

    var cx=w/2, cy=h/2; c.strokeStyle="#39424e"; c.lineWidth=6; c.lineCap="round";

}

    var R=Math.max(sizeLen*0.22,0.16), base=new THREE.Color("#39424e");
    var v=new THREE.Vector3(), tint=new THREE.Color(), acc=new THREE.Color();
    // NOTE: no hand-baked shading here — the Standard material below lets the
    // studio key/fill/rim lights shape the muscles, so features read at every
    // angle instead of washing out into flat yellow.
    heatGroup.traverse(function(o){
      if(!o.isMesh) return;
      o.geometry=o.geometry.clone();
      var pos=o.geometry.attributes.position, arr=new Float32Array(pos.count*3);
      for(var i=0;i<pos.count;i++){
        v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld);
        var bestD=1e9, wr=0, wg=0, wb=0, ws=0;
        for(var k=0;k<zones.length;k++){
          var d=v.distanceTo(zones[k].w); if(d<bestD) bestD=d;
          var w=1/Math.pow(d*d+1e-4,1.35);
          wr+=w*zones[k].c.r; wg+=w*zones[k].c.g; wb+=w*zones[k].c.b; ws+=w;
        }
        acc.setRGB(wr/ws, wg/ws, wb/ws);
        var conf=Math.max(0,Math.min(1,1-bestD/(R*1.15))); conf=conf*conf*(3-2*conf);
        tint.copy(base).lerp(acc,0.08+conf*0.55);
        arr[i*3]=tint.r; arr[i*3+1]=tint.g; arr[i*3+2]=tint.b;
      }
      o.geometry.setAttribute("color", new THREE.BufferAttribute(arr,3));
      var m=new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.5, metalness:0.08, transparent:true, opacity:0, side:THREE.DoubleSide });
      heatMats.push(m);
      o.material=m; o.renderOrder=3; o.visible=true;
    });
  }

  function applyMode(){
    if(group) group.visible=true;    // the textured runner is the hero — no paint overlay
    if(heatGroup) heatGroup.visible=false;
  }

  function fit(){
    var b=new THREE.Box3().setFromObject(group);
    center=b.getCenter(new THREE.Vector3()); sizeLen=b.getSize(new THREE.Vector3()).length();
    controls.target.copy(center);
    controls.minDistance=sizeLen*0.8; controls.maxDistance=sizeLen*4.6;
    ring.position.y=0.002; ring.position.x=center.x; ring.position.z=center.z;
    shadowPlane.position.x=center.x; shadowPlane.position.z=center.z;
    shadowPlane.scale.setScalar(Math.max(sizeLen*0.34,0.7));
    goView("hero", true);
  }
  var VIEWS = {
    hero:  function(s,c){ return [c.x+s*1.15, c.y+s*0.42, c.z+s*1.5]; },
    front: function(s,c){ return [c.x-s*2.0, c.y+s*0.05, c.z]; },
    back:  function(s,c){ return [c.x+s*2.0, c.y+s*0.05, c.z]; },
    side:  function(s,c){ return [c.x, c.y+s*0.05, c.z+s*2.0]; },
    top:   function(s,c){ return [c.x, c.y+s*2.3, c.z+s*0.02]; }
  };
  function goView(v, instant){
    var f=VIEWS[v]||VIEWS.hero, p=f(sizeLen,center);
    var pos=new THREE.Vector3(p[0],p[1],p[2]);
    if (instant){ camera.position.copy(pos); controls.target.copy(center); controls.update(); }
    else flyTo(pos, center);
  }
  function flyTo(pos, tgt){
    camTween={ fromP:camera.position.clone(), toP:pos.clone(), fromT:controls.target.clone(), toT:tgt.clone(), t0:now(), dur:700 };
    controls.autoRotate=false;
  }
  var viewBtns=document.querySelectorAll("button[data-view]");
  function markView(v){ viewBtns.forEach(function(b){ var on=b.getAttribute("data-view")===v; b.classList.toggle("active",on); b.setAttribute("aria-pressed",on?"true":"false"); }); }
  viewBtns.forEach(function(b){ b.addEventListener("click", function(){ var v=b.getAttribute("data-view"); try{localStorage.setItem("rf_view",v);}catch(e){} markView(v); goView(v); lastInteract=now(); }); });

  controls.addEventListener("start", function(){ dragging=true; lastInteract=now(); controls.autoRotate=false; });
  controls.addEventListener("end", function(){ dragging=false; lastInteract=now(); });
  var JID=(String(MESH).match(/\/jobs\/([^/]+)\//)||[])[1] || (location.pathname.split("/").pop()||"");
  var SHARE_URL=location.origin+"/s/"+encodeURIComponent(JID);
  document.getElementById("shareBtn").addEventListener("click", function(){
    var d={title:"RunForm Studio",text:"My run scored "+ANALYSIS.overall_score+"/100 — see the 3D breakdown",url:SHARE_URL};
    if(navigator.share) navigator.share(d).catch(function(){});
    else if(navigator.clipboard) navigator.clipboard.writeText(SHARE_URL).then(function(){ statusEl.textContent="Tracked link copied — "+SHARE_URL; });
    else statusEl.textContent=SHARE_URL;
  });

  function project(v){ var p=v.clone().project(camera); return { x:(p.x*0.5+0.5)*viewport.clientWidth, y:(-p.y*0.5+0.5)*viewport.clientHeight, z:p.z }; }
  function pickZone(clientX, clientY){
    if(!group) return null;
    var r=canvas.getBoundingClientRect(); ptr.x=((clientX-r.left)/r.width)*2-1; ptr.y=-((clientY-r.top)/r.height)*2+1;
    raycaster.setFromCamera(ptr,camera);
    var objs=[]; group.traverse(function(o){ if(o.isMesh) objs.push(o); });
    var hit=raycaster.intersectObjects(objs,true); if(!hit.length) return null;
    var p=hit[0].point, best=null, bd=1e9;
    Object.keys(worldAnchors).forEach(function(z){ var d=p.distanceTo(worldAnchors[z]); if(d<bd){bd=d;best=z;} });
    return (best && bd<=sizeLen*0.34) ? best : null;
  }
  function pickDot(clientX, clientY){
    var r=canvas.getBoundingClientRect(); ptr.x=((clientX-r.left)/r.width)*2-1; ptr.y=-((clientY-r.top)/r.height)*2+1;
    raycaster.setFromCamera(ptr,camera);
    var hit=raycaster.intersectObjects(dots,true); return hit.length?hit[0].object.userData.zone||hit[0].object.parent.userData.zone:null;
  }

  var downX=0, downY=0;
  canvas.addEventListener("pointerdown", function(e){ downX=e.clientX; downY=e.clientY; });
  canvas.addEventListener("pointerup", function(e){
    if (Math.abs(e.clientX-downX)>6||Math.abs(e.clientY-downY)>6) return;
    var dz=pickDot(e.clientX,e.clientY); if(dz){ selectZone(dz,true,true); return; }
    var z=pickZone(e.clientX,e.clientY); if(z) selectZone(z,false,true);
  });
  var hoverRaf=0;
  canvas.addEventListener("pointermove", function(e){
    if(hoverRaf) return;
    hoverRaf=requestAnimationFrame(function(){ hoverRaf=0;
      if(!group||dragging) return;
      var dz=pickDot(e.clientX,e.clientY);
      var z=dz||pickZone(e.clientX,e.clientY);
      RF.over3d = !!z;
      if(z!==RF.hover){ RF.hover=z; syncRail(); }
      canvas.style.cursor = z ? "pointer" : "grab";
    });
  });
  canvas.addEventListener("pointerleave", function(){ RF.over3d=false; if(!RF.selected){ RF.hover=null; syncRail(); } });
  viewport.addEventListener("mouseleave", function(){ RF.over3d=false; RF.hover=null; syncRail(); });

  function flyToZone(zone, distF){
    var w=worldAnchors[zone]; if(!w){ goView("hero"); return; }
    var az=new THREE.Vector3(w.x-center.x, 0, w.z-center.z);
    if(az.lengthSq()<1e-4) az.set(1,0,1);
    az.normalize();
    var pos=center.clone().add(az.multiplyScalar(sizeLen*(distF||1.9)));
    pos.y=w.y+sizeLen*0.08;
    flyTo(pos, center.clone().lerp(w, 0.28));
  }
  RF.fly = function(zone){ flyToZone(zone, 1.9); };
  RF.reset = function(){ goView("hero"); };

  /* ---------- Guided walkthrough ---------- */
  var tour={active:false,i:0,steps:[],timer:null,gen:0};
  var tourCtl=document.getElementById("tourCtl"), tourPlay=document.getElementById("tourPlay");
  var tourHud=document.getElementById("tourHud"), tourStep=document.getElementById("tourStep"), tourDots=document.getElementById("tourDots");
  var legendEl=document.querySelector(".legend");
  function renderTourDots(){
    tourDots.innerHTML="";
    tour.steps.forEach(function(s,i){
      var d=document.createElement("i");
      if(i===tour.i) d.className="on"; else if(i<tour.i) d.className="done";
      d.title=s.label||"";
      d.addEventListener("click", function(){ pauseAuto(); gotoStep(i); });
      tourDots.appendChild(d);
    });
  }
  function setLegendHi(on){ if(legendEl) legendEl.classList.toggle("hi", !!on); }
  function speakStep(text, after, style){
    var g=++tour.gen;
    COACH.speak(text, style).then(function(){
      if(!tour.active || tour.gen!==g) return;
      tour.timer=setTimeout(after, 850);
    });
  }
  function gotoStep(i){
    if(i<0 || i>=tour.steps.length){ endTour(true); return; }
    tour.i=i;
    var s=tour.steps[i];
    tourStep.innerHTML="<b>"+(i+1)+"</b> / "+tour.steps.length+" · "+(s.label||"");
    setLegendHi(s.kind==="colors");
    renderTourDots();
    if(s.kind==="focus" && s.zone){
      selectZone(s.zone,false,false);
      flyToZone(s.zone, SHOWCASE?1.22:1.42);
      if(!SHOWCASE) showDetail(s.zone);    // pop the detail card (not in the showcase video)
    }
    if(s.kind==="glide" && s.zone){
      flyToZone(s.zone, 1.55);   // inspect fly-by WITHOUT selecting: the turntable keeps spinning
    } else if(s.zone){
      selectZone(s.zone,false,false); flyToZone(s.zone, 1.7);
    } else {
      hideDetail(); RF.selected=null; RF.hover=null; syncRail(); goView("hero"); lastInteract=-1e9; // spin immediately
    }
    COACH.stop(); // step change kills any in-flight voice: prev/next/dots all funnel through here
    speakStep(s.text, function(){
      if(s.kind==="focus") hideDetail();   // drop the card
      if(s.kind==="free"){ RF.selected=null; RF.hover=null; syncRail(); lastInteract=0; }
      gotoStep(tour.i+1);
    }, s.style);
  }
  function startTour(){
    if(tour.active) return;                // never double-start
    COACH.stop();                          // kill any lingering audio first
    tour.steps=buildStory(); if(!tour.steps.length) return;
    tour.active=true; tour.i=-1; window.__tourActive=true;
    tourPlay.style.display="none"; tourHud.classList.add("on");
    lastInteract=(SHOWCASE?-1e9:now()); // keep the model spinning through the opening
    hideDetail();
    RF.selected=null; RF.hover=null; syncRail();
    goView("hero"); COACH.load();
    COACH.prefetchAll(tour.steps.map(function(s){ return { text:s.text, style:s.style }; })); // bubble the rest in the background
    renderTourDots();
    gotoStep(0);
  }
  function endTour(reset){
    tour.active=false; window.__tourActive=false; tour.gen++;
    if(tour.timer){ clearTimeout(tour.timer); tour.timer=null; }
    setLegendHi(false);
    COACH.stop();
    tourHud.classList.remove("on"); tourPlay.style.display="inline-flex";
    if(reset!==false){ RF.selected=null; RF.hover=null; syncRail(); goView("hero"); lastInteract=now(); }
  }
  function pauseAuto(){ if(tour.timer){ clearTimeout(tour.timer); tour.timer=null; } tour.gen++; }
  tourPlay.addEventListener("click", startTour);
  document.getElementById("tourNext").addEventListener("click", function(){ if(tour.active){ pauseAuto(); gotoStep(tour.i+1); } });
  document.getElementById("tourPrev").addEventListener("click", function(){ if(tour.active){ pauseAuto(); gotoStep(tour.i-1); } });
  document.getElementById("tourStop").addEventListener("click", function(){ endTour(true); });
  document.getElementById("volDown").addEventListener("click", function(){ COACH.changeVolume(-0.1); });
  document.getElementById("volUp").addEventListener("click", function(){ COACH.changeVolume(0.1); });
  RF.tour={ start:startTour, end:endTour, pause:pauseAuto };

  function updateMarkers(t){
    if(!markers.length) return;
    markers.forEach(function(m){
      var w=m.pos;
      var toCam=camera.position.clone().sub(w); var dist=toCam.length(); toCam.normalize();
      raycaster.set(camera.position, toCam); raycaster.far=dist-0.05;
      var occ=raycaster.intersectObjects(baseMeshes,false).length>0; raycaster.far=Infinity;
      var vis=!occ;
      var active=(m.zone===RF.selected||m.zone===RF.hover);
      var target=vis ? (active?1:0.82) : 0.08;
      m.sprite.material.opacity += (target-m.sprite.material.opacity)*0.15;
      var pulse=1+0.06*Math.sin(t/520 + m.idx);
      var sc=Math.max(m.base*0.001, m.base*(active?1.5:1)*pulse*introK);
      m.sprite.scale.setScalar(sc);
      if(m.halo){
        var hTarget=(active && vis) ? 1 : 0;
        m.halo.material.opacity += (hTarget-m.halo.material.opacity)*0.12;
        var hs=Math.max(0.001, m.base*(2.1+0.7*Math.sin(t/240))*introK);
        m.halo.scale.setScalar(hs);
      }
    });
    var tipZone=(RF.hover||RF.selected);
    var tm=null; markers.forEach(function(m){ if(m.zone===tipZone) tm=m; });
    if(tm && !dragging && !(SHOWCASE && tm.insufficient)){
      var occl=false;
      var tc=camera.position.clone().sub(tm.pos).normalize(); raycaster.set(camera.position,tc); raycaster.far=tm.pos.distanceTo(camera.position)-0.05;
      occl=raycaster.intersectObjects(baseMeshes,false).length>0; raycaster.far=Infinity;
      if(!occl){
        var e=zoneEntry(tm.zone), col="#eef2ea";
        var p=project(tm.pos);
        tip.style.left=p.x+"px"; tip.style.top=(p.y-26)+"px";
        tipDot.style.background=col; tipDot.style.color=col;
        tipB.textContent=(e.data.zone_score!=null?e.data.zone_score:"–");
        tip.style.setProperty("--tcol",col);
        tip.classList.add("on");
      } else tip.classList.remove("on");
    } else tip.classList.remove("on");
  }

  function resize(){ var w=canvas.clientWidth||canvas.parentElement.clientWidth, h=canvas.clientHeight||Math.round(window.innerHeight*0.68); renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  window.addEventListener("resize", resize);

  resize();

  (function anim(){
    requestAnimationFrame(anim);
    var t=now();
    if(introActive){
      var k=Math.min(1,(t-introT0)/850), e=1-Math.pow(1-k,3);
      introK=e;
      if(group) group.scale.setScalar(0.93+0.07*e);
      if(heatGroup) heatGroup.scale.setScalar((0.93+0.07*e)*1.016);
      heatMats.forEach(function(m){ m.opacity = e; });
      shadowPlane.material.opacity = 0.75*e;
      if(k>=1) introActive=false;
    }
    if(camTween){
      var k2=Math.min(1,(t-camTween.t0)/camTween.dur);
      var e2=k2<0.5?4*k2*k2*k2:1-Math.pow(-2*k2+2,3)/2;
      camera.position.lerpVectors(camTween.fromP,camTween.toP,e2);
      controls.target.lerpVectors(camTween.fromT,camTween.toT,e2);
      if(k2>=1) camTween=null;
    } else {
      var touring = !!window.__tourActive;
      controls.autoRotateSpeed = touring ? SPIN_TOUR : SPIN_BASE;
      if(!dragging && (!RF.selected || touring) && !RF.over3d && (touring || t-lastInteract>1500)) controls.autoRotate=true;
      else controls.autoRotate=false;
    }
    controls.update();
    updateMarkers(t);
    renderer.render(scene,camera);
  })();

  if(!THREE.GLTFLoader){ showFallback("3D loader blocked"); return; }
  var meshWait=null, meshTries=0;
  function meshRetryNote(msg){
    if(statusEl){ statusEl.textContent=msg; statusEl.style.cursor="pointer"; statusEl.title="Tap to retry 3D now";
      statusEl.onclick=function(){ meshTries=0; statusEl.style.cursor=""; statusEl.onclick=null; loadMesh(); }; }
  }
  function meshMissing(){
    // Progressive: scores/cards are already live (ANALYSIS inlined). The mesh
    // streams in when the cloud build finishes — poll job status, never 404-loop the GLB.
    fetch("/api/jobs/"+JID).then(function(r){ return r.ok?r.json():null; }).then(function(j){
      if(!j){ meshWait=setTimeout(meshMissing,5000); return; }
      if(j.stage==="failed"){ showFallback(j.error||"3D build failed"); return; }
      if(j.stage==="done"){
        fetch("/api/jobs/"+JID+"/anchors").then(function(r){ return r.ok?r.json():null; }).then(function(a){
          if(a && !a.error) ANCHORS=a;
          loadMesh();
        });
        return;
      }
      if(statusEl) statusEl.textContent="Your 3D model is building — scores and fixes below are ready now.";
      meshWait=setTimeout(meshMissing,5000);
    }).catch(function(){ meshRetryNote("Connection hiccup — retrying 3D… (tap to retry now)"); meshWait=setTimeout(meshMissing,5000); });
  }
  function loadMesh(){
    // Mesh + anchors are guaranteed present once the job is done (pipeline
    // writes mesh → anchors → done). Retry the fetch itself on blips, with a
    // visible tap-to-retry instead of a silent eternal spinner.
    new THREE.GLTFLoader().load(MESH, function(g){ meshTries=0; meshReady(g); }, undefined, function(){
      meshTries++;
      meshRetryNote("3D still loading (try "+meshTries+") — tap here to retry now.");
      meshWait=setTimeout(loadMesh,4000);
    });
  }
  function tryMesh(){
    if(meshWait){ clearTimeout(meshWait); meshWait=null; }
    meshMissing(); // always via status gate: scores now, mesh exactly when ready
  }
  function meshReady(gltf){ try{
    group=gltf.scene;
    group.traverse(function(o){ if(o.isMesh){ o.userData.orig=o.material; baseMeshes.push(o); } });
    scene.add(group);
    var b=new THREE.Box3().setFromObject(group);
    group.position.x-=(b.min.x+b.max.x)/2; group.position.z-=(b.min.z+b.max.z)/2; group.position.y-=b.min.y;
    group.updateMatrixWorld(true);
    fit(); applyMode();
    (ANALYSIS.findings||[]).forEach(function(f,i){
      var a=ANCHORS[f.zone]; if(!a) return;
      var pos=new THREE.Vector3(a[0]+group.position.x, a[1]+group.position.y, a[2]+group.position.z); worldAnchors[f.zone]=pos;
      var col=new THREE.Color("#eef2ea");
      var spr=new THREE.Sprite(new THREE.SpriteMaterial({ map:markerTex, color:col, transparent:true, opacity:0, depthWrite:false, sizeAttenuation:false }));
      spr.position.copy(pos); spr.scale.setScalar(0.05); spr.renderOrder=8; spr.userData.zone=f.zone;
      var halo=new THREE.Sprite(new THREE.SpriteMaterial({ map:markerTex, color:new THREE.Color("#c8f04a"), transparent:true, opacity:0, depthWrite:false, sizeAttenuation:false, blending:THREE.AdditiveBlending }));
      halo.position.copy(pos); halo.scale.setScalar(0.05); halo.renderOrder=7; halo.userData.zone=f.zone;
      scene.add(spr); scene.add(halo); dots.push(spr); dots.push(halo);
      markers.push({ zone:f.zone, sprite:spr, halo:halo, pos:pos, base:0.05, idx:i });
    });
    // insufficient zones: quiet hollow markers
    (ANALYSIS.insufficient||[]).forEach(function(q){
      var a=ANCHORS[q.zone]; if(!a) return;
      var pos=new THREE.Vector3(a[0]+group.position.x, a[1]+group.position.y, a[2]+group.position.z); worldAnchors[q.zone]=pos;
      var s=new THREE.Sprite(new THREE.SpriteMaterial({ map:unclearTex, color:new THREE.Color("#9aa7ba"), transparent:true, opacity:0, depthWrite:false, sizeAttenuation:false })); s.position.copy(pos); s.scale.setScalar(0.045); s.renderOrder=8; s.userData.zone=q.zone;
      scene.add(s); dots.push(s); markers.push({ zone:q.zone, sprite:s, pos:pos, base:0.045, idx:99, insufficient:true });
    });
    sendStatusText();
  }catch(e){ showFallback("model setup failed: "+((e&&e.message)||e)); return; }
  }
  tryMesh();

  function sendStatusText(){
    introActive=true; introT0=now(); lastInteract=now();
    if(loadingEl) loadingEl.style.opacity="0";
    setTimeout(function(){ if(loadingEl) loadingEl.style.display="none"; }, 700);
    statusEl.textContent="Hover a zone or tap the body — the model gently turns on its own.";
    if (tourCtl) tourCtl.style.display="flex";
    if (SHOWCASE && /[?&]auto=1/.test(location.search)){
      var items=buildStory().map(function(s){ return { text:s.text, style:s.style }; });
      COACH.ready().then(function(){ return COACH.prefetchAll(items); }).then(function(){ try{ startTour(); }catch(e){} });
    }
  }
}
</script>
</body>
</html>
