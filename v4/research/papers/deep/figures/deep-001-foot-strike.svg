<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Rearfoot vs forefoot landing schematic">
  <rect width="640" height="360" fill="#0a0c11"/>
  <text x="320" y="28" text-anchor="middle" fill="#c8f04a" font-family="sans-serif" font-size="16" font-weight="bold">Foot strike: where you land sets your impact</text>
  <!-- left panel: overstride heel strike -->
  <text x="160" y="56" text-anchor="middle" fill="#ff6b6b" font-family="sans-serif" font-size="13" font-weight="bold">Overstride heel strike</text>
  <line x1="20" y1="250" x2="300" y2="250" stroke="#3a4152" stroke-width="2"/>
  <line x1="160" y1="120" x2="160" y2="250" stroke="#3a4152" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="160" y="265" text-anchor="middle" fill="#8b93a7" font-family="sans-serif" font-size="11">center of mass</text>
  <circle cx="160" cy="120" r="12" fill="none" stroke="#e8ecf4" stroke-width="2"/>
  <line x1="160" y1="132" x2="150" y2="190" stroke="#e8ecf4" stroke-width="3"/>
  <line x1="150" y1="190" x2="105" y2="246" stroke="#e8ecf4" stroke-width="3"/>
  <line x1="105" y1="246" x2="88" y2="246" stroke="#ff6b6b" stroke-width="4"/>
  <line x1="160" y1="132" x2="185" y2="180" stroke="#e8ecf4" stroke-width="3"/>
  <text x="100" y="225" fill="#ff6b6b" font-family="sans-serif" font-size="11">heel, ahead of body</text>
  <!-- impact spike curve -->
  <polyline points="30,330 90,330 110,330 120,270 130,330 280,330" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="30" y="350" fill="#8b93a7" font-family="sans-serif" font-size="11">sharp impact transient</text>
  <!-- right panel: forefoot under body -->
  <text x="480" y="56" text-anchor="middle" fill="#c8f04a" font-family="sans-serif" font-size="13" font-weight="bold">Forefoot, under the body</text>
  <line x1="340" y1="250" x2="620" y2="250" stroke="#3a4152" stroke-width="2"/>
  <line x1="480" y1="120" x2="480" y2="250" stroke="#3a4152" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="480" y="265" text-anchor="middle" fill="#8b93a7" font-family="sans-serif" font-size="11">center of mass</text>
  <circle cx="480" cy="120" r="12" fill="none" stroke="#e8ecf4" stroke-width="2"/>
  <line x1="480" y1="132" x2="478" y2="190" stroke="#e8ecf4" stroke-width="3"/>
  <line x1="478" y1="190" x2="472" y2="246" stroke="#e8ecf4" stroke-width="3"/>
  <line x1="472" y1="246" x2="492" y2="246" stroke="#c8f04a" stroke-width="4"/>
  <line x1="480" y1="132" x2="505" y2="180" stroke="#e8ecf4" stroke-width="3"/>
  <text x="505" y="225" fill="#c8f04a" font-family="sans-serif" font-size="11">forefoot, compliant ankle</text>
  <polyline points="350,330 430,330 470,312 510,330 600,330" fill="none" stroke="#c8f04a" stroke-width="2.5"/>
  <text x="350" y="350" fill="#8b93a7" font-family="sans-serif" font-size="11">blunted impact curve</text>
  <text x="320" y="90" text-anchor="middle" fill="#5a6376" font-family="sans-serif" font-size="10">original schematic after Lieberman et al. 2010 — not paper artwork</text>
</svg>
