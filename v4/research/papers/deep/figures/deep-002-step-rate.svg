<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Step rate versus joint loading schematic">
  <rect width="640" height="360" fill="#0a0c11"/>
  <text x="320" y="28" text-anchor="middle" fill="#c8f04a" font-family="sans-serif" font-size="16" font-weight="bold">Cadence up a little, joint load down a lot</text>
  <text x="320" y="50" text-anchor="middle" fill="#8b93a7" font-family="sans-serif" font-size="12">same speed — preferred vs +5% vs +10% step rate</text>
  <!-- bars: hip/knee loading falling with cadence -->
  <g font-family="sans-serif" font-size="12">
    <text x="120" y="120" fill="#8b93a7">preferred</text>
    <rect x="220" y="95" width="220" height="26" rx="4" fill="#ff6b6b"/>
    <text x="120" y="175" fill="#8b93a7">+5% cadence</text>
    <rect x="220" y="150" width="165" height="26" rx="4" fill="#e8b04a"/>
    <text x="120" y="230" fill="#8b93a7">+10% cadence</text>
    <rect x="220" y="205" width="120" height="26" rx="4" fill="#c8f04a"/>
  </g>
  <text x="220" y="250" fill="#8b93a7" font-family="sans-serif" font-size="11">relative hip + knee loading (schematic, not to scale)</text>
  <polyline points="90,285 550,285" stroke="#3a4152" stroke-width="1"/>
  <text x="90" y="310" fill="#e8ecf4" font-family="sans-serif" font-size="12">Takeaway: subtle cadence lift = substantially less hip/knee loading.</text>
  <text x="90" y="332" fill="#8b93a7" font-family="sans-serif" font-size="11">Backs the cadence-ladder drill in the knees rule.</text>
  <text x="320" y="76" text-anchor="middle" fill="#5a6376" font-family="sans-serif" font-size="10">original schematic after Heiderscheit et al. 2011 — not paper artwork</text>
</svg>
