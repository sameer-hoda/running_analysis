<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Trunk lean versus kneecap stress schematic">
  <rect width="640" height="360" fill="#0a0c11"/>
  <text x="320" y="28" text-anchor="middle" fill="#c8f04a" font-family="sans-serif" font-size="16" font-weight="bold">Trunk posture steers kneecap load</text>
  <!-- upright runner -->
  <text x="180" y="56" text-anchor="middle" fill="#ff6b6b" font-family="sans-serif" font-size="13" font-weight="bold">Upright</text>
  <line x1="60" y1="270" x2="300" y2="270" stroke="#3a4152" stroke-width="2"/>
  <circle cx="180" cy="120" r="12" fill="none" stroke="#e8ecf4" stroke-width="2"/>
  <line x1="180" y1="132" x2="180" y2="200" stroke="#e8ecf4" stroke-width="3"/>
  <line x1="180" y1="200" x2="170" y2="268" stroke="#e8ecf4" stroke-width="3"/>
  <line x1="180" y1="200" x2="195" y2="268" stroke="#e8ecf4" stroke-width="3"/>
  <line x1="180" y1="150" x2="160" y2="180" stroke="#e8ecf4" stroke-width="2.5"/>
  <line x1="180" y1="150" x2="200" y2="180" stroke="#e8ecf4" stroke-width="2.5"/>
  <rect x="110" y="290" width="140" height="22" rx="4" fill="#ff6b6b"/>
  <text x="180" y="306" text-anchor="middle" fill="#0a0c11" font-family="sans-serif" font-size="12" font-weight="bold">higher PFJ stress</text>
  <!-- leaning runner -->
  <text x="470" y="56" text-anchor="middle" fill="#c8f04a" font-family="sans-serif" font-size="13" font-weight="bold">~7° more lean (ankles)</text>
  <line x1="350" y1="270" x2="590" y2="270" stroke="#3a4152" stroke-width="2"/>
  <circle cx="492" cy="112" r="12" fill="none" stroke="#e8ecf4" stroke-width="2"/>
  <line x1="488" y1="124" x2="470" y2="200" stroke="#e8ecf4" stroke-width="3"/>
  <line x1="470" y1="200" x2="460" y2="268" stroke="#e8ecf4" stroke-width="3"/>
  <line x1="470" y1="200" x2="488" y2="268" stroke="#e8ecf4" stroke-width="3"/>
  <line x1="482" y1="142" x2="462" y2="172" stroke="#e8ecf4" stroke-width="2.5"/>
  <line x1="482" y1="142" x2="502" y2="172" stroke="#e8ecf4" stroke-width="2.5"/>
  <rect x="405" y="290" width="100" height="22" rx="4" fill="#c8f04a"/>
  <text x="455" y="306" text-anchor="middle" fill="#0a0c11" font-family="sans-serif" font-size="12" font-weight="bold">lower PFJ stress</text>
  <text x="320" y="340" text-anchor="middle" fill="#8b93a7" font-family="sans-serif" font-size="11">Lean from the ankles, not the waist — demand shifts off the knee.</text>
  <text x="320" y="76" text-anchor="middle" fill="#5a6376" font-family="sans-serif" font-size="10">original schematic after Teng &amp; Powers 2014 — not paper artwork</text>
</svg>
